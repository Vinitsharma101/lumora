[project]
name = "opencut-api"
version = "0.2.0"
description = "OpenCut FastAPI backend — AI video platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.28.0",
    "redis>=5.2.0",
    "sse-starlette>=2.1.0",
    "anthropic>=0.39.0",
    "openai>=1.55.0",
    "google-generativeai>=0.8.0",
    # Supabase storage
    "supabase>=2.0.0",
    # Background job queue
    "arq>=0.26.0",
    # AI services (all API-based, no local models)
    "replicate>=0.25.0",
    # WebSocket collaboration
    "websockets>=12.0",
    # Google Cloud AI
    "google-cloud-aiplatform>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
